name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Expo project
        run: npx expo-doctor || true

      - name: Note about APK
        run: |
          echo "================================================"
          echo "Full APK build requires Android SDK + signing."
          echo "For local APK without EAS:"
          echo "  npx expo prebuild --platform android"
          echo "  cd android && ./gradlew assembleRelease"
          echo "================================================"
